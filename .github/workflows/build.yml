name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Read version and changelog
        id: meta
        shell: bash
        run: |
          VERSION=$(grep -E "versionName ['"][^'"]+['"]" app/build.gradle | sed -E "s/.*versionName ['"]([^'"]+)['"].*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          awk -v ver="$VERSION" '$0 ~ "^## " ver " " {found=1; next} found && $0 ~ "^## " {exit} found {print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Beta $VERSION" > release-notes.md
            echo "" >> release-notes.md
            echo "See CHANGELOG.md for changes." >> release-notes.md
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          TAG="v$VERSION"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TITLE="Goblins vs KavirLand $VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$TAG" "$APK#Goblins-vs-KavirLand-$VERSION-debug.apk" --clobber
          else
            gh release create "$TAG" "$APK#Goblins-vs-KavirLand-$VERSION-debug.apk"               --title "$TITLE" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi

      - name: Upload workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: Goblins-vs-KavirLand-${{ steps.meta.outputs.version }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
